services:
  php:
    build:
      context: .
      dockerfile: Containerfiles/php_8.5.11
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:z
      - ./Containerfiles/php_fpm.conf:/usr/local/etc/php-fpm.d/zz-app.conf:ro,z
    tmpfs:
      - /var/www/html/.secrets
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:-default}"
      POSTGRES_USER: "${POSTGRES_USER:-pgsql_user}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
    secrets:
      - postgres_password
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) === false ? 1 : 0);'"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Containerfiles/nginx_1.31.6
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html/public:ro,z
      - ./Containerfiles/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./Containerfiles/nginx_default.conf:/etc/nginx/conf.d/default.conf:ro,z
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      php:
        condition: service_healthy

  redis:
    image: docker.io/redis:8.10.2-alpine
    restart: unless-stopped
    working_dir: /data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: docker.io/postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pgsql_user}"
      POSTGRES_DB: "${POSTGRES_DB:-default}"
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
      # Tells the image to extract the root credential natively from the mounted secret instead of plain text env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    restart: unless-stopped
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql:Z
    # Healthcheck ensures dependent applications (PHP) wait until the engine is fully accepting queries
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

secrets:
  postgres_password:
    external: true

volumes:
  postgres-data:
  redis-data:
